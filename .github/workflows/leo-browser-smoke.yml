name: Leo browser smoke tests

on:
  push:
    paths:
      - "src/gateway/**"
      - "scripts/leo_browser_smoke.py"
      - "requirements-browser-smoke.txt"
      - ".github/workflows/leo-browser-smoke.yml"

  pull_request:
    paths:
      - "src/gateway/**"
      - "scripts/leo_browser_smoke.py"
      - "requirements-browser-smoke.txt"
      - ".github/workflows/leo-browser-smoke.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Leo Chromium browser validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: |
          python -m pip install \
            -r requirements-browser-smoke.txt
          python -m playwright install \
            --with-deps chromium

      - name: Run Leo browser integration smoke
        run: |
          python scripts/leo_browser_smoke.py

      - name: Upload synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: leo-browser-${{ github.run_id }}
          path: |
            docs/evidence/2026-11-02-step80-leo-desktop.png
            docs/evidence/2026-11-02-step80-leo-mobile.png
          if-no-files-found: warn
          retention-days: 7
